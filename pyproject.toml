[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["shared", "agents", "gateway", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
